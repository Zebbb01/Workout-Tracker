<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C0A09">
<title>Offline · Body Tracker</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root { color-scheme: light dark; --bg: #FAFAF9; --fg: #1C1917; --muted: #57534E; --accent: #C2410C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0C0A09; --fg: #FAFAF9; --muted: #A8A29E; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 22rem; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been opened on this device yet, so it needs a connection. Today, Log and Meals work offline once you've opened them, and everything you log syncs when you're back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
