name: Keep the database awake

# Supabase pauses a free project after a week with too little database
# activity, and its docs suggest a few requests every day. This makes three
# light calls a day, so the live demo never wakes up slowly for a visitor.
#
# GitHub turns off scheduled workflows in a public repository after 60 days
# without commits, and emails the owner first. Re-enable it from the Actions
# tab, or push anything.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Three light reads
        env:
          URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for i in 1 2 3; do
            curl --fail --silent --show-error --retry 3 "$URL/rest/v1/rpc/ping" -H "apikey: $KEY"
            echo
          done
