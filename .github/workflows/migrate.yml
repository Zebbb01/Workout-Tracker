name: Database migrations

# Applies supabase/migrations to the production Supabase project when a
# release lands on main. Needs two repository secrets, SUPABASE_ACCESS_TOKEN
# and SUPABASE_PROJECT_ID; the CLI signs in to the database with a temporary
# role, so no database password is stored anywhere.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
      - run: supabase db push --linked
