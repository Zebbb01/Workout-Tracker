name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so next-auth can start; no real secret is used in CI.
      AUTH_SECRET: ci-placeholder-not-a-secret
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A throwaway Supabase built from supabase/migrations, for the RLS tests.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase start
      - name: Point the tests at the local Supabase
        run: |
          eval "$(supabase status -o env)"
          echo "RLS_TEST_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "RLS_TEST_SUPABASE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
