name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A throwaway Supabase built from supabase/migrations, for the RLS and browser tests.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase start
      - name: Point the app and the tests at the local Supabase
        run: |
          eval "$(supabase status -o env)"
          KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          {
            echo "RLS_TEST_SUPABASE_URL=$API_URL"
            echo "RLS_TEST_SUPABASE_KEY=$KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY"
          } >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
